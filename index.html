<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu PC Roda?</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div class="card">
    <h1>Meu PC Roda?</h1>

    <div class="inputs-grid">
      <div class="input-group">
        <label for="ram">RAM (GB)</label>
        <input type="number" id="ram" placeholder="Ex: 8" min="1">
      </div>
      
      <!-- Grupo de VRAM com o "rodapé" integrado logo abaixo da caixa -->
      <div class="input-group">
        <label for="vram">VRAM (MB)</label>
        <div class="input-with-footer">
          <input type="number" id="vram" placeholder="Ex: 512, 1024, 2048..." min="0" step="any">
          <span class="input-footer">1 GB = 1024 MB | 2 GB = 2048 MB</span>
        </div>
      </div>
    </div>

    <!-- Campo de Processador -->
    <div class="input-group">
      <label for="cpu">Processador (Linha + Modelo)</label>
      <input 
        type="text" 
        id="cpu" 
        placeholder="Ex: Intel Core i3-2100, AMD Ryzen 5 3600..." 
        list="cpu-prefixes"
        autocomplete="off"
      >
      <span class="hint-text">Escolha o começo (ex: <strong>Intel Core i3-</strong>) e digite o número do modelo.</span>

      <datalist id="cpu-prefixes">
        <option value="Intel Core i3-">
        <option value="Intel Core i5-">
        <option value="Intel Core i7-">
        <option value="Intel Core i9-">
        <option value="Intel Core 2 Duo ">
        <option value="AMD Ryzen 3 ">
        <option value="AMD Ryzen 5 ">
        <option value="AMD Ryzen 7 ">
        <option value="AMD Ryzen 9 ">
        <option value="AMD FX-">
        <option value="AMD Phenom ">
      </datalist>
    </div>

    <div class="input-group">
      <label for="game-search">Nome do Jogo</label>
      <div class="search-group">
        <input type="text" id="game-search" placeholder="Ex: GTA V, Cyberpunk, CS:GO...">
        <button id="btn-search">Buscar</button>
      </div>
      <span id="error-message" class="error-text hidden">Por favor, digite um nome válido.</span>
    </div>

    <div id="result-container" class="result-box hidden">
      <h2 id="game-title"></h2>
      <div id="status-badge" class="badge"></div>
      <img id="game-image" src="" alt="Capa do Jogo">
      <div class="requirements">
        <strong>Requisitos Mínimos:</strong>
        <p id="game-requirements"></p>
      </div>
    </div>
  </div>

  <script src="script.js?v=7"></script>
</body>
</html>
