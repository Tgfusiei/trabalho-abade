<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu PC Roda?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Meu PC Roda?</h1>

    <div class="inputs-grid">
      <div class="input-group">
        <label for="ram">RAM (GB)</label>
        <input type="number" id="ram" placeholder="Ex: 8" min="1">
      </div>
      <div class="input-group">
        <label for="vram">VRAM (GB)</label>
        <input type="number" id="vram" placeholder="Ex: 4" min="0">
      </div>
    </div>

    <div class="input-group">
      <label for="game-search">Nome do Jogo</label>
      <div class="search-group">
        <input type="text" id="game-search" placeholder="Ex: GTA V, Cyberpunk...">
        <button id="btn-search">Buscar</button>
      </div>
      <!-- Texto de erro discreto -->
      <span id="error-message" class="error-text hidden">Por favor, digite um nome válido.</span>
    </div>

    <div id="result-container" class="result-box hidden">
      <h2 id="game-title"></h2>
      <div id="status-badge" class="badge"></div>
      <img id="game-image" src="" alt="Capa do Jogo">
      <div class="requirements">
        <strong>Requisitos Mínimos:</strong>
        <p id="game-requirements"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
