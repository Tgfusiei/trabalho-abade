<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu PC Roda?</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="card">
    <h1>Meu PC Roda?</h1>

    <div class="inputs-grid">
      <div class="input-group">
        <label for="ram">RAM (GB)</label>
        <input type="number" id="ram" placeholder="Ex: 8" min="1">
      </div>
      <div class="input-group">
        <label for="vram">VRAM (GB)</label>
        <input type="number" id="vram" placeholder="Ex: 4" min="0" step="0.5">
      </div>
    </div>

    <!-- Campo de Processador com Lista Customizada -->
    <div class="input-group autocomplete-wrapper">
      <label for="cpu">Processador (Nome Completo / Modelo)</label>
      <input 
        type="text" 
        id="cpu" 
        placeholder="Toque ou digite i3, i5, i7, Ryzen..." 
        autocomplete="off"
      >
      <span class="hint-text">Ex: <strong>Intel Core i3-2100</strong>, <strong>Intel Core i7-3770</strong>, <strong>AMD Ryzen 5 3600</strong></span>
      
      <!-- Lista flutuante de sugestões -->
      <ul id="cpu-dropdown" class="dropdown-list hidden"></ul>
    </div>

    <div class="input-group">
      <label for="game-search">Nome do Jogo</label>
      <div class="search-group">
        <input type="text" id="game-search" placeholder="Ex: GTA V, Cyberpunk, CS:GO...">
        <button id="btn-search">Buscar</button>
      </div>
      <span id="error-message" class="error-text hidden">Por favor, digite um nome válido.</span>
    </div>

    <div id="result-container" class="result-box hidden">
      <h2 id="game-title"></h2>
      <div id="status-badge" class="badge"></div>
      <img id="game-image" src="" alt="Capa do Jogo">
      <div class="requirements">
        <strong>Requisitos Mínimos:</strong>
        <p id="game-requirements"></p>
      </div>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
